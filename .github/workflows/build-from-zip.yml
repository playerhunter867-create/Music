name: Build APK from uploaded ZIP

on:
  push:
    branches: [ main, master ]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.13'

jobs:
  build:
    name: Extract ZIP and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Find uploaded project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip )
          if [ "${#zips[@]}" -eq 0 ]; then
            echo 'No ZIP found in repository root.' >&2
            exit 1
          fi

          # Prefer the ZIP changed by the triggering commit.
          selected=''
          if [ "${{ github.event_name }}" = 'push' ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD^ HEAD -- '*.zip' | grep -E '^[^/]+\.zip$' | head -n 1 || true)
            if [ -n "$changed" ] && [ -f "$changed" ]; then
              selected="$changed"
            fi
          fi

          # Fallback: newest ZIP in the repository root.
          if [ -z "$selected" ]; then
            selected=$(ls -1t -- *.zip | head -n 1)
          fi

          echo "Using ZIP: $selected"
          echo "zip=$selected" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted build-project
          mkdir -p extracted build-project
          unzip -q -o "${{ steps.zip.outputs.zip }}" -d extracted

          # Locate settings.gradle(.kts), whether the ZIP has a flat layout
          # or contains one top-level project directory.
          settings=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
          if [ -z "$settings" ]; then
            echo 'The ZIP does not contain an Android/Gradle project (settings.gradle.kts/settings.gradle).' >&2
            exit 1
          fi

          project_root=$(dirname "$settings")
          echo "Project root: $project_root"
          cp -a "$project_root"/. build-project/

          if [ ! -f build-project/gradlew ]; then
            echo 'No Gradle wrapper found; the workflow will use the installed Gradle version.'
          else
            chmod +x build-project/gradlew
          fi

          test -f build-project/app/build.gradle.kts || test -f build-project/app/build.gradle || {
            echo 'The extracted project does not contain an app module.' >&2
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Build debug APK
        working-directory: build-project
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Build release APK
        working-directory: build-project
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find build-project/app/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NULL-WAVE-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
